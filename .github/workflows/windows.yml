name: Build Windows app
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/setup-binaries.ps1
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test-native.ps1
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-native.ps1
      - run: Compress-Archive -Path native-dist/* -DestinationPath YouTube-Audio-2.0-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: YouTube-Audio-2.0-Windows-x64
          path: YouTube-Audio-2.0-Windows-x64.zip
